services:
  ollama:
    image: ollama/ollama:latest
    container_name: local-peer-ollama
    restart: always
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: local-peer-webui
    restart: always
    ports:
      - "${WEBUI_PORT}:8080"
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}'
      # Use Qdrant as the RAG vector store instead of the embedded ChromaDB
      - 'VECTOR_DB=qdrant'
      - 'QDRANT_URI=http://qdrant:6333'
    volumes:
      - ./webui_data:/app/backend/data
    depends_on:
      - ollama

  qdrant:
    image: qdrant/qdrant:latest
    container_name: local-peer-qdrant
    restart: always
    ports:
      - "${QDRANT_PORT}:6333"
      - "6334:6334"
    volumes:
      - ${QDRANT_STORAGE_PATH}:/qdrant/storage

networks:
  default:
    driver: bridge
